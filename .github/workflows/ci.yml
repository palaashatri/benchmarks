name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Repository hygiene
        run: python3 tools/check_repository.py
      - name: Validate experiment manifests
        run: |
          ./benchctl validate experiments/quick.yaml
          ./benchctl validate experiments/standard.yaml
          ./benchctl validate experiments/gc-focused.yaml

  runtime-discovery:
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Discover runtime and capabilities
        run: |
          ./benchctl doctor
          ./benchctl discover-runtimes
          ./benchctl list-runtimes
          ./benchctl list-capabilities
