name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile controller modules
        run: python3 -m py_compile tools/benchctl.py tools/benchctl_entry.py tools/check_repository.py tools/run_tier2_experiment.py tools/measurement_stats.py tools/host_environment.py tools/telemetry.py
      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Repository hygiene
        run: python3 tools/check_repository.py
      - name: Validate experiment manifests
        run: |
          ./benchctl validate experiments/quick.yaml
          ./benchctl validate experiments/standard.yaml
          ./benchctl validate experiments/gc-focused.yaml
          ./benchctl validate experiments/ledger-benchmark.yaml

  runtime-discovery:
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Discover runtime and capabilities
        run: |
          ./benchctl doctor
          ./benchctl discover-runtimes
          ./benchctl list-runtimes
          ./benchctl list-capabilities

  compatibility-smoke:
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java 8 bytecode compatibility workload
        run: |
          (cd benchmarks/00-runtime-compatibility/app && ./run.sh test)
          (cd benchmarks/00-runtime-compatibility/harness && ./run.sh test)

  repaired-workload-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ledger correctness and truthful harness
        run: |
          (cd benchmarks/01-fintech-ledger/app && ./run.sh test)
          (cd benchmarks/01-fintech-ledger/harness && ./run.sh test)
      - name: Streaming, polyglot and ETL contracts
        run: |
          (cd benchmarks/03-streaming-analytics/app && ./run.sh test)
          (cd benchmarks/05-polyglot-service/app && ./run.sh test)
          (cd benchmarks/08-etl-batch/app && ./run.sh test)
      - name: Vector and FFM equivalence
        run: cd benchmarks/04-ml-inference-panama-vector/app && ./run.sh test
      - name: Cold-start child isolation
        run: cd benchmarks/07-coldstart-suite/app && ./run.sh test
      - name: Inference mode truthfulness
        run: cd benchmarks/09-onnx-inference/app && ./run.sh test
      - name: Monolith class surface
        run: cd benchmarks/13-large-monolith/app && ./run.sh test

  workload-architectures:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Owned-process lifecycle and framed TCP regressions
        run: bash tools/workload_tests/run_common.sh
      - name: Real workload architectures and truthful smoke harnesses
        run: |
          for workload in 02-microservices-mesh 06-massive-chat-loom 10-microservices-fleet 11-autoscaling-burst 12-hft-trading-gateway; do
            (cd "benchmarks/$workload/app" && ./run.sh test)
            (cd "benchmarks/$workload/harness" && ./run.sh test)
          done

  process-workloads-java17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java 17 lifecycle, fleet and autoscaling
        run: |
          bash tools/workload_tests/run_common.sh
          for workload in 10-microservices-fleet 11-autoscaling-burst; do
            (cd "benchmarks/$workload/app" && ./run.sh test)
            (cd "benchmarks/$workload/harness" && ./run.sh test)
          done

  maven-workloads:
    strategy:
      fail-fast: false
      matrix:
        workload:
          - 01-fintech-ledger
          - 02-microservices-mesh
          - 03-streaming-analytics
          - 04-ml-inference-panama-vector
          - 05-polyglot-service
          - 06-massive-chat-loom
          - 07-coldstart-suite
          - 08-etl-batch
          - 09-onnx-inference
          - 10-microservices-fleet
          - 11-autoscaling-burst
          - 12-hft-trading-gateway
          - 13-large-monolith
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Every workload builds with its own Maven wrapper, pinned to Maven 3.9.11 and
      # verified by SHA-256. `mvn test` runs the workload's correctness gates.
      - name: Application lifecycle
        run: cd "benchmarks/${{ matrix.workload }}/app" && ./mvnw -B test
      - name: Harness lifecycle
        run: cd "benchmarks/${{ matrix.workload }}/harness" && ./mvnw -B test
