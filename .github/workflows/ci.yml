name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Every job runs the same Java and Maven entry points on Linux, Windows and macOS. Shell steps call the
# POSIX wrappers through `sh` so a checkout without the executable bit still runs; the Windows job also
# runs the native `.cmd` launchers.
jobs:
  controller:
    name: controller (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Controller unit tests
        run: sh ./mvnw -B -f tools/benchctl/pom.xml test
      - name: Repository hygiene and public-scope gate
        run: sh ./benchctl hygiene
      - name: Validate every experiment manifest
        run: |
          for manifest in experiments/*.yaml; do
            sh ./benchctl validate "$manifest"
          done
      - name: Runtime discovery and capabilities
        run: |
          sh ./benchctl doctor
          sh ./benchctl discover-runtimes
          sh ./benchctl list-runtimes
          sh ./benchctl list-capabilities
      - name: Plan the Tier 2 matrix
        if: matrix.java == '21'
        run: sh ./benchctl plan experiments/tier2-matrix.yaml > /dev/null
      - name: Native Windows launchers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mvnw.cmd -q -B -f tools\benchctl\pom.xml -DskipTests package
          benchctl.cmd doctor
          benchctl.cmd discover-runtimes

  shared-libraries:
    name: shared libraries (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Owned-process lifecycle and framed TCP regressions
        run: sh ./mvnw -B -f benchmarks/common/pom.xml test

  compatibility:
    name: 00 compatibility (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['8', '21', '25']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Application correctness gates
        run: cd benchmarks/00-runtime-compatibility/app && sh ./mvnw -B test
      - name: Harness correctness gates
        run: cd benchmarks/00-runtime-compatibility/harness && sh ./mvnw -B test

  workloads:
    name: ${{ matrix.workload }} (${{ matrix.os }}, JDK 21)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        workload:
          - 01-fintech-ledger
          - 02-microservices-mesh
          - 03-streaming-analytics
          - 04-ml-inference-panama-vector
          - 05-polyglot-service
          - 06-massive-chat-loom
          - 07-coldstart-suite
          - 08-etl-batch
          - 09-onnx-inference
          - 10-microservices-fleet
          - 11-autoscaling-burst
          - 12-hft-trading-gateway
          - 13-large-monolith
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Every workload builds with its own Maven wrapper, pinned to Maven 3.9.11 and verified by SHA-256.
      # `mvn test` runs the workload's correctness gates; the harness gates run after the application's.
      - name: Application correctness gates
        run: cd "benchmarks/${{ matrix.workload }}/app" && sh ./mvnw -B test
      - name: Harness correctness gates
        run: cd "benchmarks/${{ matrix.workload }}/harness" && sh ./mvnw -B test

  workloads-jdk17:
    name: ${{ matrix.workload }} (${{ matrix.os }}, JDK 17)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        workload:
          - 09-onnx-inference
          - 10-microservices-fleet
          - 11-autoscaling-burst
          - 13-large-monolith
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Application correctness gates
        run: cd "benchmarks/${{ matrix.workload }}/app" && sh ./mvnw -B test
      - name: Harness correctness gates
        run: cd "benchmarks/${{ matrix.workload }}/harness" && sh ./mvnw -B test
