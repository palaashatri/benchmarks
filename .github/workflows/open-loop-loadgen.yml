name: Open-loop load generator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  loadgen:
    name: loadgen (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and self-test the coordinated-omission-safe HdrHistogram generator
        run: sh ./mvnw -B -f tools/loadgen/pom.xml test
