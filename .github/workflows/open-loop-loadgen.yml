name: Open-loop load generator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  loadgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test open-loop HdrHistogram generator
        run: tools/loadgen/run.sh test
