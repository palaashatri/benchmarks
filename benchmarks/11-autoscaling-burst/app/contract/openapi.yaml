{
  "openapi": "3.0.3",
  "info": {
    "title": "11-autoscaling-burst HTTP contract",
    "version": "0.3.0"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8080"
    }
  ],
  "paths": {
    "/api/v1/catalog/search": {
      "post": {
        "responses": {
          "202": {
            "description": "Admit queued work; 429 indicates rate/queue rejection"
          },
          "400": {
            "description": "Invalid request"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          },
          "429": {
            "description": "Admission rate or queue capacity exceeded"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        }
      }
    },
    "/api/v1/catalog/health": {
      "get": {
        "responses": {
          "200": {
            "description": "Ready worker health"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/api/v1/metrics/scaling": {
      "get": {
        "responses": {
          "200": {
            "description": "Replica identity, queue, admission and completion counters"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/health": {
      "get": {
        "responses": {
          "200": {
            "description": "Health and process/transport capabilities; process degradation returns 503"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/runtime": {
      "get": {
        "responses": {
          "200": {
            "description": "Actual application process identity"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "responses": {
          "200": {
            "description": "Prometheus operational counters"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    }
  }
}
