{
  "openapi": "3.0.3",
  "info": {
    "title": "10-microservices-fleet HTTP contract",
    "version": "0.3.0"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8080"
    }
  ],
  "paths": {
    "/api/v1/fleet/status": {
      "get": {
        "responses": {
          "200": {
            "description": "Replica PIDs, generations and readiness"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/api/v1/fleet/deploy/{id}": {
      "post": {
        "responses": {
          "200": {
            "description": "Publish a ready replacement and retire the previous JVM"
          },
          "400": {
            "description": "Invalid request"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ]
    },
    "/api/v1/service/{id}/inventory/{item}": {
      "get": {
        "responses": {
          "200": {
            "description": "Inventory read forwarded to the addressed replica"
          },
          "400": {
            "description": "Invalid request"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "item",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ]
    },
    "/api/v1/catalog/{productId}": {
      "get": {
        "responses": {
          "200": {
            "description": "Synthetic gateway catalog"
          },
          "400": {
            "description": "Invalid request"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      },
      "parameters": [
        {
          "name": "productId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ]
    },
    "/api/v1/orders": {
      "post": {
        "responses": {
          "200": {
            "description": "Create a synthetic gateway order"
          },
          "400": {
            "description": "Invalid request"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        }
      }
    },
    "/api/v1/orders/{orderId}": {
      "get": {
        "responses": {
          "200": {
            "description": "Read synthetic order status"
          },
          "400": {
            "description": "Invalid request"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      },
      "parameters": [
        {
          "name": "orderId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ]
    },
    "/health": {
      "get": {
        "responses": {
          "200": {
            "description": "Health and process/transport capabilities; process degradation returns 503"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/runtime": {
      "get": {
        "responses": {
          "200": {
            "description": "Actual application process identity"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "responses": {
          "200": {
            "description": "Prometheus operational counters"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    }
  }
}
