{
  "openapi": "3.0.3",
  "info": {
    "title": "06-massive-chat-loom HTTP contract",
    "version": "0.3.0"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8080"
    }
  ],
  "paths": {
    "/rooms": {
      "get": {
        "responses": {
          "200": {
            "description": "List rooms"
          }
        }
      }
    },
    "/rooms/{id}/subscribers": {
      "get": {
        "responses": {
          "200": {
            "description": "Actual socket subscriptions and HTTP registrations"
          },
          "400": {
            "description": "Invalid request"
          }
        }
      },
      "post": {
        "responses": {
          "200": {
            "description": "Register a user; a TCP subscription is required for delivery"
          },
          "400": {
            "description": "Invalid request"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ]
    },
    "/rooms/{id}/messages": {
      "get": {
        "responses": {
          "200": {
            "description": "Recent room message history"
          },
          "400": {
            "description": "Invalid request"
          }
        }
      },
      "post": {
        "responses": {
          "200": {
            "description": "Publish to live TCP subscribers"
          },
          "400": {
            "description": "Invalid request"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ]
    },
    "/api/v1/stats": {
      "get": {
        "responses": {
          "200": {
            "description": "Actual connection, subscription and delivery counts"
          }
        }
      }
    },
    "/health": {
      "get": {
        "responses": {
          "200": {
            "description": "Health and process/transport capabilities; process degradation returns 503"
          }
        }
      }
    },
    "/runtime": {
      "get": {
        "responses": {
          "200": {
            "description": "Actual application process identity"
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "responses": {
          "200": {
            "description": "Prometheus operational counters"
          }
        }
      }
    }
  }
}
