{
  "openapi": "3.0.3",
  "info": {
    "title": "02-microservices-mesh HTTP contract",
    "version": "0.3.0"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8080"
    }
  ],
  "paths": {
    "/api/v1/users/{id}": {
      "get": {
        "responses": {
          "200": {
            "description": "Account lookup and notification call"
          },
          "400": {
            "description": "Invalid request"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      },
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ]
    },
    "/api/v1/orders": {
      "post": {
        "responses": {
          "200": {
            "description": "Record a transaction after account validation"
          },
          "400": {
            "description": "Invalid request"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        }
      }
    },
    "/state": {
      "get": {
        "responses": {
          "200": {
            "description": "State of the addressed gateway/service process"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/health": {
      "get": {
        "responses": {
          "200": {
            "description": "Health and process/transport capabilities; process degradation returns 503"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/runtime": {
      "get": {
        "responses": {
          "200": {
            "description": "Actual application process identity"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "responses": {
          "200": {
            "description": "Prometheus operational counters"
          },
          "503": {
            "description": "Required service or replacement unavailable"
          }
        }
      }
    }
  }
}
