syntax = "proto3";

package com.palaashatri.bench.b12_hft_trading_gateway;

option java_package = "com.palaashatri.bench.b12.app.proto";
option java_multiple_files = true;

// Optional fields are unset when the gateway has no value. proto3 scalars would
// otherwise report 0 or "" for unknown data, which the benchmark truth rules forbid.
service TradingGateway {
  rpc SubmitOrder(OrderRequest) returns (OrderAck);
  rpc CancelOrder(CancelRequest) returns (OrderAck);
  rpc GetOrderStatus(StatusRequest) returns (OrderStatus);
}

message OrderRequest {
  string symbol = 1;
  string side = 2;
  int64 quantity = 3;
  int64 price_nanos = 4;
}

message CancelRequest {
  string order_id = 1;
}

message StatusRequest {
  string order_id = 1;
}

message OrderAck {
  optional string order_id = 1;
  bool accepted = 2;
  optional string reason = 3;
}

message OrderStatus {
  optional string order_id = 1;
  optional string status = 2;
  optional int64 remaining_quantity = 3;
}
